<!doctype html>
<html lang="hu">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NotGather</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏢</text></svg>">
  <link rel="stylesheet" href="assets/css/app.css?v=3">
</head>
<body>
  <!-- Belépés -->
  <section id="login" class="screen hidden">
    <div class="card auth-card">
      <div class="logo">🏢</div>
      <h1>Virtuális iroda</h1>
      <form id="login-form" class="form" autocomplete="on">
        <label>Felhasználónév<input name="username" required autocomplete="username" autocapitalize="none"></label>
        <label>Jelszó<input name="password" type="password" required autocomplete="current-password"></label>
        <button class="btn primary" type="submit">Belépés</button>
        <p id="login-error" class="err"></p>
      </form>
    </div>
  </section>

  <!-- Már belépett, csak egy kattintás kell a hanghoz -->
  <section id="enter" class="screen hidden">
    <div class="card auth-card">
      <div class="logo">🏢</div>
      <h1>Szia, <span id="enter-name"></span>!</h1>
      <p class="muted-text">A böngésző csak egy kattintás után engedi a hangot, ezért ezt a gombot kell megnyomni.</p>
      <button id="enter-btn" class="btn primary big">Belépek az irodába</button>
      <button id="enter-logout" class="btn link">Kijelentkezés</button>
    </div>
  </section>

  <!-- Hiba / kiléptetés -->
  <section id="fatal" class="screen hidden">
    <div class="card auth-card">
      <div class="logo">⚠️</div>
      <p id="fatal-text"></p>
      <button id="fatal-retry" class="btn primary hidden">Újrapróbálás</button>
    </div>
  </section>

  <!-- Az iroda -->
  <section id="app" class="screen hidden">
    <div id="stage-wrap"></div>
    <main id="map"></main>
    <div id="audio-sink" hidden></div>
  </section>

  <noscript>Az irodához JavaScript szükséges.</noscript>
  <script type="module" src="assets/js/app.js?v=3"></script>
</body>
</html>
